 <script>
document.querySelectorAll('.lab-chip').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.lab-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const v=btn.dataset.view;
  document.querySelectorAll('[data-kind]').forEach(el=>{
    const show=v==='all'||(v==='mockups'&&el.dataset.kind==='mockup')||(v==='games'&&el.dataset.kind==='game');
    el.style.display=show?'block':'none';
  });
});

document.querySelectorAll('.view-btn').forEach(btn=>btn.addEventListener('click',()=>{
  const id=btn.dataset.mock;
  const base=id.replace(/-(phone|desktop)$/,'');
  const phone=document.getElementById(base+'-phone');
  const desktop=document.getElementById(base+'-desktop');
  if(phone) phone.style.display=id.endsWith('phone')?'block':'none';
  if(desktop) desktop.style.display=id.endsWith('desktop')?'block':'none';
  btn.parentElement.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}));

const shipCells=new Set(['1-1','1-2','1-3','5-4','6-4','7-4','2-7','3-7']);
let shots=new Set();
function buildNaval(){
  const p=document.getElementById('naval-player'),t=document.getElementById('naval-target'),status=document.getElementById('naval-status');
  if(!p||!t) return;
  p.innerHTML='';t.innerHTML='';shots=new Set();
  for(let r=1;r<=8;r++) for(let col=1;col<=8;col++){
    const pc=document.createElement('button'); pc.className='sq'+(shipCells.has(r+'-'+col)?' ship':''); pc.disabled=true; pc.textContent=shipCells.has(r+'-'+col)?'●':''; p.appendChild(pc);
    const tc=document.createElement('button'); tc.className='sq';
    tc.addEventListener('click',()=>{const k=r+'-'+col;if(shots.has(k))return;shots.add(k);const hit=shipCells.has(k);tc.classList.add(hit?'hit':'miss');tc.textContent=hit?'✦':'×';status.textContent=hit?'🎯 Acertou um navio!':'🌊 Água. Tente outra coordenada.'});
    t.appendChild(tc);
  }
  status.textContent='Clique em uma casa da área de ataque.';
}
document.getElementById('naval-new')?.addEventListener('click',buildNaval);

const deck=[
 {n:'São Paulo',pop:46.65,pib:2.38,area:248.2,tur:150,den:166.23,st:true},
 {n:'Rio de Janeiro',pop:17.46,pib:.86,area:43.8,tur:120,den:381.87},
 {n:'Minas Gerais',pop:21.17,pib:.65,area:586.5,tur:90,den:35.76},
 {n:'Bahia',pop:14.93,pib:.31,area:564.7,tur:80,den:26.03},
 {n:'Paraná',pop:11.52,pib:.46,area:199.3,tur:70,den:57.85},
 {n:'Amazonas',pop:4.21,pib:.11,area:1559.1,tur:40,den:2.67}
];
let cpu=deck[1];
function renderTrunfo(){
  const wrap=document.getElementById('my-attrs'); if(!wrap)return;
  wrap.innerHTML='';
  [['pop','População'],['pib','PIB'],['area','Área'],['tur','Pontos turísticos'],['den','Densidade (menor ganha)']].forEach(([k,l])=>{
    const b=document.createElement('button'); b.className='attr-btn'; b.innerHTML=l+'<b>'+deck[0][k]+'</b>'; b.onclick=()=>playTrunfo(k); wrap.appendChild(b);
  });
}
function playTrunfo(k){
  const me=deck[0], out=document.getElementById('trunfo-result');
  let win=me.st&&!cpu.st;
  if(!win) win=k==='den'?me[k]<cpu[k]:me[k]>cpu[k];
  if(out) out.textContent=win?'🏆 Você venceu a rodada!':'🤖 O computador venceu a rodada!';
}
renderTrunfo();

const pieces=['♜','♞','♝','♛','♚','♝','♞','♜','♟','♟','♟','♟','♟','♟','♟','♟','','','','','','','','','','','','','','','','','♟','♟','♟','♟','♟','♟','♟','♟','♜','♞','♝','♛','♚','♝','♞','♜'];
let selected=null;const cb=document.getElementById('chessboard');
function renderChess(){
  if(!cb)return; cb.innerHTML='';
  pieces.forEach((p,i)=>{
    const s=document.createElement('button'); s.className='ch '+(((Math.floor(i/8)+i)%2===0)?'l':'d'); s.textContent=p;
    s.onclick=()=>{
      if(selected===null&&p){selected=i;s.classList.add('sel');const n=document.getElementById('chess-note');if(n)n.textContent='Peça selecionada. Agora escolha uma casa de destino.';}
      else if(selected!==null){pieces[i]=pieces[selected];pieces[selected]='';selected=null;const n=document.getElementById('chess-note');if(n)n.textContent='Movimento visual realizado.';renderChess();}
    };
    cb.appendChild(s);
  });
}
document.getElementById('chess-reset')?.addEventListener('click',()=>{location.reload()});
renderChess();
